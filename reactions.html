<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Named Reactions Library — JEE Main Organic Chemistry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="desktop-sidebar" id="desktop-sidebar-mount"></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-crumb">
            <a href="dashboard.html">Course</a> <span>›</span>
            <span style="color:var(--text-primary);">Named Reactions Library</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="search-trigger-btn" onclick="App.openSearch()">
            <span>🔍 Search reactions</span>
            <span class="kbd-shortcut">Ctrl K</span>
          </button>
          <div class="streak-pill">
            <span>🔥</span>
            <span id="topbar-streak-val">1 Day Streak</span>
          </div>
          <button class="btn-icon" onclick="App.toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
        </div>
      </header>

      <main class="page-container">
        <div style="margin-bottom:20px;">
          <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">
            Named Reactions Master Library
          </h1>
          <p style="font-size:14.5px;color:var(--text-muted);margin-top:4px;">
            Complete catalog with reactants, reagents, conditions, products, mechanism pathways, stereochemical exceptions, and JEE shortcuts.
          </p>
        </div>

        <!-- Search & Filter Bar -->
        <div class="card" style="padding:16px;">
          <input type="text" id="reaction-search-input" class="search-modal-input" style="border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 14px;width:100%;font-size:14px;background:var(--bg-card);" placeholder="Search named reaction by name, reagent, or chapter..." oninput="filterReactions()" />
        </div>

        <!-- Reactions Mount Container -->
        <div id="reactions-list-container"></div>
      </main>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-mount"></nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/definitions.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/curriculum-chapters-1-to-25.js"></script>
  <script src="js/pyqs.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/reagents.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      App.init("reactions");
      filterReactions();
    });

    function filterReactions() {
      const box = document.getElementById("reactions-list-container");
      const input = document.getElementById("reaction-search-input");
      const q = input ? input.value.trim().toLowerCase() : "";

      if (!box || !window.CHEM_REACTIONS) return;

      const filtered = window.CHEM_REACTIONS.filter(r => {
        if (!q) return true;
        return r.name.toLowerCase().includes(q) ||
               r.chapter.toLowerCase().includes(q) ||
               r.reagent.toLowerCase().includes(q) ||
               r.products.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        box.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--text-muted);">No reactions match "${q}".</div>`;
        return;
      }

      let html = "";
      filtered.forEach(r => {
        const isBookmarked = window.CourseStorage.isBookmarked("reactions", r.id);
        html += `
          <div class="card" id="${r.id}" style="margin-bottom:20px;border-top:3px solid var(--primary);">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
              <div>
                <span class="badge badge-vhigh">${r.chapter}</span>
                <h2 style="font-size:20px;font-weight:800;color:var(--text-primary);margin-top:4px;">${r.name}</h2>
              </div>
              <button class="btn-icon" onclick="toggleReactionBookmark('${r.id}')" title="Bookmark Reaction">
                ${isBookmarked ? '★' : '☆'}
              </button>
            </div>

            <!-- Reaction Flow Spec Box -->
            <div style="background:var(--bg-card-subtle);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;border:1px solid var(--border-subtle);">
              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:10px;">
                <div>
                  <span style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Reactants</span>
                  <div style="font-weight:700;font-size:13.5px;margin-top:2px;">${r.reactants}</div>
                </div>
                <div>
                  <span style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;">Reagents & Catalyst</span>
                  <div style="font-weight:700;font-size:13.5px;margin-top:2px;color:var(--primary);">${r.reagent}</div>
                </div>
                <div>
                  <span style="font-size:11px;font-weight:700;color:var(--warning);text-transform:uppercase;">Reaction Conditions</span>
                  <div style="font-weight:700;font-size:13.5px;margin-top:2px;">${r.conditions}</div>
                </div>
                <div>
                  <span style="font-size:11px;font-weight:700;color:var(--success);text-transform:uppercase;">Major Products</span>
                  <div style="font-weight:700;font-size:13.5px;margin-top:2px;color:var(--success);">${r.products}</div>
                </div>
              </div>
            </div>

            <!-- Mechanism Pathway -->
            <div style="margin-bottom:12px;font-size:13.5px;color:var(--text-secondary);">
              <strong style="color:var(--text-primary);">Mechanism Pathway:</strong> ${r.mechanism}
            </div>

            <!-- Critical Exceptions -->
            ${r.exceptions ? `
              <div style="margin-bottom:10px;padding:10px;background:var(--danger-subtle);border-left:3px solid var(--danger);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);">
                <strong style="color:var(--danger);">⚠️ Critical Exceptions:</strong> ${r.exceptions}
              </div>
            ` : ''}

            <!-- JEE Exam Shortcut -->
            ${r.jeeTrick ? `
              <div style="padding:10px;background:var(--primary-subtle);border-left:3px solid var(--primary);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);">
                <strong style="color:var(--primary);">⚡ JEE Rapid Trick:</strong> ${r.jeeTrick}
              </div>
            ` : ''}
          </div>
        `;
      });

      box.innerHTML = html;
    }

    function toggleReactionBookmark(rxnId) {
      window.CourseStorage.toggleBookmark("reactions", rxnId);
      filterReactions();
    }
  </script>
</body>
</html>
