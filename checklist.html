<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syllabus Checklist — JEE Main Organic Chemistry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="desktop-sidebar" id="desktop-sidebar-mount"></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-crumb">
            <a href="dashboard.html">Course</a> <span>›</span>
            <span style="color:var(--text-primary);">Syllabus Checklist</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="search-trigger-btn" onclick="App.openSearch()">
            <span>🔍 Search curriculum</span>
            <span class="kbd-shortcut">Ctrl K</span>
          </button>
          <div class="streak-pill">
            <span>🔥</span>
            <span id="topbar-streak-val">1 Day Streak</span>
          </div>
          <button class="btn-icon" onclick="App.toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
        </div>
      </header>

      <main class="page-container">
        <div style="margin-bottom:20px;">
          <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">
            JEE Main Organic Chemistry Syllabus Checklist
          </h1>
          <p style="font-size:14.5px;color:var(--text-muted);margin-top:4px;">
            Every single topic across the 26 chapters with real-time completion checkboxes. Check or uncheck to track your syllabus coverage.
          </p>
        </div>

        <!-- Overall Checklist Progress -->
        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:800;font-size:15px;">Syllabus Completion</span>
            <span id="checklist-pct" style="font-weight:800;color:var(--primary);font-size:16px;">0%</span>
          </div>
          <div class="progress-bar-container" style="height:8px;margin:10px 0 4px 0;">
            <div id="checklist-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div id="checklist-stats" style="font-size:12.5px;color:var(--text-muted);">0 / 0 topics completed</div>
        </div>

        <!-- Chapters Checklist Mount -->
        <div id="checklist-container"></div>
      </main>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-mount"></nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/curriculum-chapters-1-to-25.js"></script>
  <script src="js/pyqs.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/reagents.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      App.init("checklist");
      renderChecklist();
    });

    function renderChecklist() {
      const box = document.getElementById("checklist-container");
      if (!box || !window.CHEM_CURRICULUM || !window.CHEM_CURRICULUM.CHAPTERS) return;

      const state = window.CourseStorage.getState();
      const chapters = window.CHEM_CURRICULUM.CHAPTERS;

      let totalTopics = 0;
      let completedTopics = 0;

      let html = "";
      chapters.forEach(ch => {
        let chTopics = ch.topics ? ch.topics.length : 1;
        totalTopics += chTopics;

        html += `
          <div class="card" style="margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:10px;margin-bottom:10px;">
              <div>
                <span class="badge badge-med">Chapter ${ch.number}</span>
                <span style="font-weight:800;font-size:16px;margin-left:6px;color:var(--text-primary);">${ch.title}</span>
              </div>
              <a href="chapter-${ch.number}.html" style="font-size:12.5px;color:var(--primary);font-weight:700;text-decoration:none;">
                Open Chapter →
              </a>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;">
        `;

        if (ch.topics) {
          ch.topics.forEach(t => {
            const isDone = state.completedTopics[t.id] !== undefined;
            if (isDone) completedTopics += 1;

            html += `
              <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;padding:4px 0;">
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTopicCheck('${t.id}', this.checked)" style="width:16px;height:16px;accent-color:var(--primary);" />
                <span style="color:var(--text-primary);${isDone ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">
                  <strong>Topic ${t.number}:</strong> ${t.title}
                </span>
              </label>
            `;
          });
        }

        html += `
            </div>
          </div>
        `;
      });

      box.innerHTML = html;

      // Update progress bar
      const pct = totalTopics === 0 ? 0 : Math.round((completedTopics / totalTopics) * 100);
      document.getElementById("checklist-pct").textContent = `${pct}%`;
      document.getElementById("checklist-fill").style.width = `${pct}%`;
      document.getElementById("checklist-stats").textContent = `${completedTopics} / ${totalTopics} topics completed`;
    }

    function toggleTopicCheck(topicId, isChecked) {
      const s = window.CourseStorage.getState();
      if (isChecked) {
        s.completedTopics[topicId] = {
          date: new Date().toISOString(),
          pct: 100,
          status: "mastered"
        };
      } else {
        delete s.completedTopics[topicId];
      }
      window.CourseStorage.saveState(s);
      renderChecklist();
    }
  </script>
</body>
</html>
