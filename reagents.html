<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reagents Master Reference — JEE Main Organic Chemistry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="desktop-sidebar" id="desktop-sidebar-mount"></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-crumb">
            <a href="dashboard.html">Course</a> <span>›</span>
            <span style="color:var(--text-primary);">Reagents Master Reference</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="search-trigger-btn" onclick="App.openSearch()">
            <span>🔍 Search reagents</span>
            <span class="kbd-shortcut">Ctrl K</span>
          </button>
          <div class="streak-pill">
            <span>🔥</span>
            <span id="topbar-streak-val">1 Day Streak</span>
          </div>
          <button class="btn-icon" onclick="App.toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
        </div>
      </header>

      <main class="page-container">
        <div style="margin-bottom:20px;">
          <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">
            Reagents Master Reference Guide
          </h1>
          <p style="font-size:14.5px;color:var(--text-muted);margin-top:4px;">
            Filterable catalog detailing selectivity, solvent requirements, targeted functional transformations, and JEE exam traps.
          </p>
        </div>

        <!-- Search Input -->
        <div class="card" style="padding:16px;">
          <input type="text" id="reagent-search" class="search-modal-input" style="border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 14px;width:100%;font-size:14px;background:var(--bg-card);" placeholder="Search reagent name, category, or transformation (e.g. LiAlH4, NaBH4, PCC, Grignard)..." oninput="renderReagents()" />
        </div>

        <div id="reagents-mount"></div>
      </main>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-mount"></nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/definitions.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/curriculum-chapters-1-to-25.js"></script>
  <script src="js/pyqs.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/reagents.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      App.init("reagents");
      renderReagents();
    });

    function renderReagents() {
      const box = document.getElementById("reagents-mount");
      const q = document.getElementById("reagent-search").value.trim().toLowerCase();

      if (!box || !window.CHEM_REAGENTS) return;

      const filtered = window.CHEM_REAGENTS.filter(r => {
        if (!q) return true;
        return r.name.toLowerCase().includes(q) ||
               r.category.toLowerCase().includes(q) ||
               (r.reduces && r.reduces.toLowerCase().includes(q)) ||
               (r.oxidizes && r.oxidizes.toLowerCase().includes(q));
      });

      if (filtered.length === 0) {
        box.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--text-muted);">No reagents found.</div>`;
        return;
      }

      let html = "";
      filtered.forEach(r => {
        html += `
          <div class="card" style="margin-bottom:16px;border-left:4px solid var(--primary);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <h3 style="font-size:18px;font-weight:800;color:var(--text-primary);">${r.name}</h3>
              <span class="badge badge-med">${r.category}</span>
            </div>

            <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
              <strong>Solvent / Conditions:</strong> ${r.solvent}
            </div>

            ${r.reduces ? `<div style="font-size:13.5px;margin-bottom:6px;"><strong>Reduces:</strong> ${r.reduces}</div>` : ''}
            ${r.oxidizes ? `<div style="font-size:13.5px;margin-bottom:6px;"><strong>Oxidizes:</strong> ${r.oxidizes}</div>` : ''}
            ${r.reactsWith ? `<div style="font-size:13.5px;margin-bottom:6px;"><strong>Reacts With:</strong> ${r.reactsWith}</div>` : ''}

            <div style="font-size:13.5px;margin-bottom:6px;"><strong>Key Transformation / Products:</strong> ${r.products}</div>

            ${r.exceptions ? `
              <div style="font-size:13px;color:var(--danger);background:var(--danger-subtle);padding:8px;border-radius:var(--radius-sm);margin-top:6px;">
                <strong>⚠️ Exceptions / Does NOT React With:</strong> ${r.exceptions}
              </div>
            ` : ''}

            ${r.jeeTrick ? `
              <div style="font-size:13px;color:var(--primary);background:var(--primary-subtle);padding:8px;border-radius:var(--radius-sm);margin-top:6px;">
                <strong>⚡ JEE Trick:</strong> ${r.jeeTrick}
              </div>
            ` : ''}
          </div>
        `;
      });

      box.innerHTML = html;
    }
  </script>
</body>
</html>
