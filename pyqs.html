<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEE Main PYQs Bank — Organic Chemistry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="desktop-sidebar" id="desktop-sidebar-mount"></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-crumb">
            <a href="dashboard.html">Course</a> <span>›</span>
            <span style="color:var(--text-primary);">JEE Main PYQs</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="search-trigger-btn" onclick="App.openSearch()">
            <span>🔍 Search curriculum</span>
            <span class="kbd-shortcut">Ctrl K</span>
          </button>
          <div class="streak-pill">
            <span>🔥</span>
            <span id="topbar-streak-val">1 Day Streak</span>
          </div>
          <button class="btn-icon" onclick="App.toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
        </div>
      </header>

      <main class="page-container">
        <!-- Header -->
        <div style="margin-bottom:20px;">
          <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">
            JEE Main Organic Chemistry PYQs
          </h1>
          <p style="font-size:14.5px;color:var(--text-muted);margin-top:4px;">
            Authentic previous years' questions with verified source tagging, official answer keys, and step-by-step diagnostic solutions.
          </p>
        </div>

        <!-- Filter Controls Bar -->
        <div class="card" style="padding:16px;">
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:10px;">
            <div>
              <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Chapter</label>
              <select id="filter-chapter" class="btn-secondary" style="width:100%;padding:7px 10px;font-size:13px;margin-top:3px;" onchange="renderPYQList()">
                <option value="all">All Chapters</option>
                <option value="ch-00">Chapter 0: Foundation</option>
                <option value="ch-01">Chapter 1: Carbon</option>
                <option value="ch-08">Chapter 8: GOC</option>
                <option value="ch-10">Chapter 10: Alkenes</option>
                <option value="ch-15">Chapter 15: Phenols</option>
              </select>
            </div>

            <div>
              <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Exam Year</label>
              <select id="filter-year" class="btn-secondary" style="width:100%;padding:7px 10px;font-size:13px;margin-top:3px;" onchange="renderPYQList()">
                <option value="all">All Years</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
              </select>
            </div>

            <div>
              <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Difficulty</label>
              <select id="filter-diff" class="btn-secondary" style="width:100%;padding:7px 10px;font-size:13px;margin-top:3px;" onchange="renderPYQList()">
                <option value="all">All Difficulties</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
              </select>
            </div>

            <div>
              <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Source Tag</label>
              <select id="filter-tag" class="btn-secondary" style="width:100%;padding:7px 10px;font-size:13px;margin-top:3px;" onchange="renderPYQList()">
                <option value="all">All Questions</option>
                <option value="verified-pyq">Verified PYQ Only</option>
                <option value="jee-main-style">JEE Main Style</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Questions Mount Container -->
        <div id="pyqs-list-container"></div>
      </main>
    </div>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-mount"></nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/curriculum-chapters-1-to-25.js"></script>
  <script src="js/pyqs.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/reagents.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      App.init("pyqs");
      renderPYQList();
    });

    const userSelectedPYQ = {};

    function renderPYQList() {
      const box = document.getElementById("pyqs-list-container");
      if (!box || !window.CHEM_PYQS) return;

      const fChapter = document.getElementById("filter-chapter").value;
      const fYear = document.getElementById("filter-year").value;
      const fDiff = document.getElementById("filter-diff").value;
      const fTag = document.getElementById("filter-tag").value;

      const filtered = window.CHEM_PYQS.QUESTIONS.filter(q => {
        if (fChapter !== "all" && q.chapterId !== fChapter) return false;
        if (fYear !== "all" && q.year.toString() !== fYear) return false;
        if (fDiff !== "all" && q.difficulty !== fDiff) return false;
        if (fTag !== "all" && q.type !== fTag) return false;
        return true;
      });

      if (filtered.length === 0) {
        box.innerHTML = `
          <div class="card" style="text-align:center;padding:40px;color:var(--text-muted);">
            No PYQs match the selected filter criteria.
          </div>
        `;
        return;
      }

      let html = "";
      filtered.forEach((q, idx) => {
        const isVerified = q.type === "verified-pyq";
        const badgeClass = isVerified ? "badge-vhigh" : "badge-med";
        const tagLabel = isVerified ? `Verified PYQ • ${q.exam} ${q.year} (${q.session})` : "JEE Main Style Practice";

        html += `
          <div class="card" style="margin-bottom:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="badge ${badgeClass}">${tagLabel}</span>
                <span class="badge badge-ncert">${q.chapterTitle}</span>
                <span style="font-size:12px;color:var(--text-muted);">${q.topic} • ${q.difficulty}</span>
              </div>
              <button class="btn-icon" style="width:30px;height:30px;font-size:12px;" onclick="togglePYQBookmark('${q.id}')" title="Bookmark">
                ${window.CourseStorage.isBookmarked('questions', q.id) ? '★' : '☆'}
              </button>
            </div>

            <div style="font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:14px;white-space:pre-line;">
              ${idx + 1}. ${q.question}
            </div>

            <div class="option-list" id="pyq-opts-${q.id}">
              ${q.options.map((opt, optIdx) => `
                <div class="option-item ${userSelectedPYQ[q.id] === optIdx ? 'selected' : ''}" id="pyq-opt-${q.id}-${optIdx}" onclick="selectPYQOption('${q.id}', ${optIdx}, ${q.answer})">
                  <span class="option-marker">${String.fromCharCode(65 + optIdx)}</span>
                  <span>${opt}</span>
                </div>
              `).join("")}
            </div>

            <div id="pyq-sol-${q.id}" style="display:none;margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--bg-card-subtle);border-left:4px solid var(--primary);">
              <div style="font-weight:800;font-size:14px;color:var(--primary);margin-bottom:6px;">
                Correct Answer: Option ${String.fromCharCode(65 + q.answer)}
              </div>
              <div style="font-size:13.5px;margin-bottom:6px;"><strong>Concept:</strong> ${q.conceptTested || ''}</div>
              <div style="font-size:13.5px;margin-bottom:6px;"><strong>Approach:</strong> ${q.approach || ''}</div>
              <div style="font-size:13.5px;margin-bottom:6px;"><strong>Explanation:</strong> ${q.explanation}</div>
              ${q.wrongOptionsAnalysis ? `<div style="font-size:12.5px;color:var(--text-muted);margin-bottom:4px;"><strong>Options Analysis:</strong> ${q.wrongOptionsAnalysis}</div>` : ''}
              ${q.commonTrap ? `<div style="font-size:12.5px;color:var(--danger);font-weight:600;">⚠️ Exam Trap: ${q.commonTrap}</div>` : ''}
            </div>

            <div style="margin-top:12px;display:flex;justify-content:flex-end;">
              <button class="btn-secondary" style="font-size:12.5px;" onclick="togglePYQSolution('${q.id}')">
                Reveal Full Solution & Exam Trap
              </button>
            </div>
          </div>
        `;
      });

      box.innerHTML = html;
    }

    function selectPYQOption(qId, chosenIdx, correctIdx) {
      userSelectedPYQ[qId] = chosenIdx;
      const isCorrect = chosenIdx === correctIdx;
      const qObj = window.CHEM_PYQS.QUESTIONS.find(q => q.id === qId);
      if (qObj) {
        window.CourseStorage.recordQuestionAttempt(qObj, chosenIdx, isCorrect, qObj.chapterId, "pyq");
      }

      // Highlight correct / wrong
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`pyq-opt-${qId}-${i}`);
        if (!el) continue;
        el.className = "option-item";
        if (i === correctIdx) el.classList.add("correct");
        else if (i === chosenIdx && !isCorrect) el.classList.add("incorrect");
      }

      document.getElementById(`pyq-sol-${qId}`).style.display = "block";
    }

    function togglePYQSolution(qId) {
      const el = document.getElementById(`pyq-sol-${qId}`);
      if (el) el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function togglePYQBookmark(qId) {
      window.CourseStorage.toggleBookmark("questions", qId);
      renderPYQList();
    }
  </script>
</body>
</html>
